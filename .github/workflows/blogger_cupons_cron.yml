name: Cupons Válidos — Bot de Cupons de Desconto (4x ao dia)

on:
  # PAUSADO ATÉ SEGUNDA ORDEM
  # schedule:
  #   - cron: '0 0,12,16,20 * * *'  # 09:00, 13:00, 17:00 e 21:00 BRT
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-cupons-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repositório
      uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Instalar dependências
      run: pip install -r requirements.txt

    - name: Reconstruir credenciais e ambiente
      env:
        ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        CLIENT_SECRET_CONTENT: ${{ secrets.CLIENT_SECRET_JSON }}
        TOKEN_CONTENT: ${{ secrets.TOKEN_JSON }}
      run: |
        printf '%s' "$ENV_FILE_CONTENT" > .env
        printf '%s' "$CLIENT_SECRET_CONTENT" > client_secret.json
        printf '%s' "$TOKEN_CONTENT" > token.json
        python -c "import json; json.load(open('token.json')); print('token.json OK')"

    - name: Executar Bot de Cupons de Desconto
      run: python blogger_bot_cupons.py

    - name: Salvar histórico de ofertas no repositório
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add cupons_history.json || true
        git commit -m "chore: atualizar histórico de cupons publicados [skip ci]" || true
        git push || true
